# Disk Watch: shows what wakes up and reads from the HDDs.
# Create the data directory on an always-on SSD before deploying.
# Set DISKWATCH_PASSWORD and DISKWATCH_BIND_IP as stack environment variables (not in this file).
services:
  diskwatch:
    # Built from the Dockerfile on GitHub, so this file can be pasted into Portainer's Web editor.
    build: https://github.com/capturo/diskwatch.git#main
    pull_policy: build        # rebuild from the latest main on every deploy
    image: diskwatch:local
    container_name: diskwatch
    restart: unless-stopped
    privileged: true          # needed for fanotify and reading other processes' info
    pid: host                 # see the real NAS processes, not just the container's
    read_only: true           # the application only needs to write to /data
    security_opt:
      - no-new-privileges:true
    ports:
      # Listen only on the NAS LAN IP; reserve that IP in your router.
      - "${DISKWATCH_BIND_IP:?Set DISKWATCH_BIND_IP to the NAS LAN IP}:8099:8099"
    environment:
      - DISKWATCH_PASSWORD=${DISKWATCH_PASSWORD:-} # empty = random password printed to the log
      - WATCH_VOLUME=/volume1 # the HDD volume
      - QUIET_SECONDS=300     # HDD silence that counts as "asleep" before a wakeup
      - TRACE_READS=0         # start with lower event volume; use 1 only if needed
      - PYTHONDONTWRITEBYTECODE=1
      - BURST_MB_S=20         # combined HDD read+write rate that counts as heavy I/O
      - BURST_MIN_SECONDS=120 # only report heavy I/O that lasts at least this long
    volumes:
      - type: bind
        source: /volume2/docker/diskwatch/data # must already exist on the SSD volume
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
